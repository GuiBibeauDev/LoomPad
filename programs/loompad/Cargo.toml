[package]
name = "loompad-program"
version = "0.1.0"
description = "LoomPad protocol program"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "loompad"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[lints.rust]
# Anchor 0.31 emits this cfg in downstream crates. Register it without
# enabling debug code when CI builds with --all-features.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("anchor-debug"))'] }

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = { version = "0.31.1", features = ["token_2022"] }
