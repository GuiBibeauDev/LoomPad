name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "19 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript,actions
      - uses: github/codeql-action/analyze@v4
